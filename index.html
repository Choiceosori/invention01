<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 동네 발명 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky top bar · step rail on the left (desktop) or progress chips on top (tablet/phone) · one working column with a sticky bottom nav.
   Look: a clean field notebook for young inventors — navy ink, teal accent, a drawn village map, and a white "paper" report sheet. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#e8eff1; --ink:#14233b; --ink-2:#4a5a6e; --line:#d0dae0;
  --navy:#1d3a6e; --teal:#0a7470; --teal-soft:#d9efec; --amber:#8f5300; --amber-soft:#fcefd4;
  --good:#256f35; --good-soft:#e0f1e2; --bad:#a8362b; --bad-soft:#f8e2df;
  --btn-bg:#1d3a6e; --btn-fg:#ffffff; --focus:#d98200; --spot-hover:rgba(29,58,110,.08);
  --m-grass:#dcecd2; --m-grass2:#cbe2bd; --m-road:#c6cfd6; --m-lane:#ffffff; --m-bldg:#ffffff; --m-roof:#5579b3; --m-roof2:#cf7454;
  --m-win:#b8d3e8; --m-water:#b7dbec; --m-tree:#7cb066; --m-trunk:#86664a; --m-field:#e6c79c; --m-fieldline:#ffffff;
  --m-awn1:#dc6455; --m-awn2:#efbd47; --m-bin1:#3b78c4; --m-bin2:#3f9a53; --m-bin3:#dc9b33; --m-hl:#d98200; --m-edge:#8796a4;
  --paper:#ffffff; --paper-ink:#18222f; --paper-muted:#5a6878; --paper-line:#cfd7de; --paper-tint:#eef4f6; --paper-accent:#0a7470;
  --f-display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e161f; --surface:#16212c; --surface-2:#1c2a37; --ink:#e6edf4; --ink-2:#a3b2c2; --line:#2d3c4c;
    --navy:#a9c2f0; --teal:#5cc8c0; --teal-soft:#143633; --amber:#f2b860; --amber-soft:#3a2b13;
    --good:#7fd08e; --good-soft:#163222; --bad:#f19a8f; --bad-soft:#3a1d1a;
    --btn-bg:#a9c2f0; --btn-fg:#0e161f; --focus:#f2b860; --spot-hover:rgba(169,194,240,.10);
    --m-grass:#1c2c22; --m-grass2:#22372a; --m-road:#34424f; --m-lane:#62717e; --m-bldg:#2c3a48; --m-roof:#4f6fa6; --m-roof2:#a45c44;
    --m-win:#3f5a72; --m-water:#1f4052; --m-tree:#3f7341; --m-trunk:#6a5038; --m-field:#5e4a33; --m-fieldline:#8b7558;
    --m-awn1:#a8493f; --m-awn2:#b38c33; --m-bin1:#2f5f9c; --m-bin2:#32753f; --m-bin3:#a87628; --m-hl:#f2b860; --m-edge:#7d8c9a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161f; --surface:#16212c; --surface-2:#1c2a37; --ink:#e6edf4; --ink-2:#a3b2c2; --line:#2d3c4c;
  --navy:#a9c2f0; --teal:#5cc8c0; --teal-soft:#143633; --amber:#f2b860; --amber-soft:#3a2b13;
  --good:#7fd08e; --good-soft:#163222; --bad:#f19a8f; --bad-soft:#3a1d1a;
  --btn-bg:#a9c2f0; --btn-fg:#0e161f; --focus:#f2b860; --spot-hover:rgba(169,194,240,.10);
  --m-grass:#1c2c22; --m-grass2:#22372a; --m-road:#34424f; --m-lane:#62717e; --m-bldg:#2c3a48; --m-roof:#4f6fa6; --m-roof2:#a45c44;
  --m-win:#3f5a72; --m-water:#1f4052; --m-tree:#3f7341; --m-trunk:#6a5038; --m-field:#5e4a33; --m-fieldline:#8b7558;
  --m-awn1:#a8493f; --m-awn2:#b38c33; --m-bin1:#2f5f9c; --m-bin2:#32753f; --m-bin3:#a87628; --m-hl:#f2b860; --m-edge:#7d8c9a;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{text-wrap:balance;margin:0}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fine{font-size:.86rem;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons & form controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:.5em 1.05em;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;text-align:center;line-height:1.3;text-decoration:none}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:.3em .8em;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:.2em .1em;color:var(--teal);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px}
label,.label{display:block;font-weight:700;margin-bottom:.35rem}
.hint{display:block;font-weight:400;font-size:.86rem;color:var(--ink-2)}
.req{display:inline-block;font-size:.72rem;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:.05em .5em;border-radius:99px;margin-left:.4em;vertical-align:.1em}
input[type=text],textarea,select{width:100%;min-height:44px;padding:.6em .75em;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.55}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.75}
.field{display:grid;gap:.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-height:44px;padding:.4em .95em;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:.35em}
.chip[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700;color:var(--teal)}
.chip .x{font-weight:700;color:var(--ink-2);margin-left:.15em}
.seg{display:inline-flex;flex-wrap:wrap;gap:.35rem}
.seg button{min-height:40px;padding:.3em .8em;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.92rem;display:inline-flex;align-items:center;gap:.3em}
.seg button[aria-pressed="true"]{font-weight:700}
.seg button[data-v="good"][aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.seg button[data-v="okay"][aria-pressed="true"],.seg button[data-v="improve"][aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber)}
.seg button[data-v="retry"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.seg .mk{font-weight:700;width:1.1em;text-align:center}
.add-row{display:flex;gap:.5rem}
.add-row input{flex:1;min-width:0}
.list{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.45rem}
.list li{display:flex;gap:.5rem;align-items:center}
.list li input{flex:1;min-width:0}
.list .num{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.icon-btn{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
.empty-list{color:var(--ink-2);font-size:.9rem;padding:.4rem 0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;padding-block:.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.5rem;background:none;border:0;padding:.2rem 0;cursor:pointer;font-family:var(--f-display);font-size:1.3rem;color:var(--navy);min-height:44px}
.brand svg{width:30px;height:30px;flex:none}
.step-count{font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:99px;padding:.15em .75em;font-size:.92rem}
.save{font-size:.85rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:.35em}
.save::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--good)}
.save[data-state="saving"]::before{background:var(--amber)}
.save[data-state="error"]{color:var(--bad);font-weight:700}
.save[data-state="error"]::before{background:var(--bad)}
.top-actions{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap}

/* ---------- app layout ---------- */
.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.steps-side{display:none}
@media (min-width:1024px){
  .layout{grid-template-columns:230px minmax(0,1fr);gap:2rem}
  .steps-side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;padding-block:1.5rem}
  .progress{display:none}
}
.side-group{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--ink-2);margin:1rem 0 .4rem}
.side-group:first-child{margin-top:0}
.side-list{list-style:none;margin:0;padding:0;display:grid;gap:.2rem}
.side-list button{width:100%;display:flex;align-items:center;gap:.6rem;text-align:left;background:none;border:0;border-radius:10px;padding:.5rem .6rem;cursor:pointer;min-height:44px;color:var(--ink)}
.side-list button:hover{background:var(--surface-2)}
.side-list button[aria-current="step"]{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--navy);font-weight:700}
.dot{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
[aria-current="step"] .dot{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.dot.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.side-note{margin-top:1.4rem;font-size:.82rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:1rem}

.progress{padding-top:1rem}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.pchips{display:flex;gap:.35rem;overflow-x:auto;padding:.6rem 0 .2rem;scrollbar-width:thin}
.pchips button{flex:none;display:flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.25rem .75rem .25rem .3rem;cursor:pointer;min-height:40px;font-size:.88rem;color:var(--ink)}
.pchips button[aria-current="step"]{border-color:var(--navy);font-weight:700}
.pchips .dot{width:1.6em;height:1.6em;font-size:.78rem}

main{min-width:0;padding-block:1.25rem 0}
.step-head{display:grid;gap:.35rem;margin-bottom:1.25rem}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--teal)}
.step-head h1{font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.2;color:var(--navy)}
.step-head h1:focus{outline:none}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:62ch}
.stack{display:grid;gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem 1.2rem}
.card h2{font-size:1.25rem;color:var(--navy);margin-bottom:.6rem}
.card h3{font-size:1rem;margin-bottom:.4rem}
.q-num{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--navy);color:var(--surface);font-size:.82rem;margin-right:.4rem;vertical-align:.1em;font-family:var(--f-body);font-weight:700}
.note{display:flex;gap:.6rem;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:.75rem .9rem;font-size:.93rem}
.note.warn{background:var(--amber-soft)}
.note.ok{background:var(--good-soft)}
.note b{flex:none}
.two{display:grid;gap:1rem}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.bottom-nav{position:sticky;bottom:0;z-index:10;margin-top:2rem;display:flex;gap:.6rem;justify-content:space-between;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding-block:.75rem calc(.75rem + env(safe-area-inset-bottom,0px))}
.bottom-nav .btn{min-width:0}
.bottom-nav .next{flex:0 1 auto}

/* ---------- start screen ---------- */
.start{max-width:1100px;margin:0 auto;padding-block:1.5rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:1.4rem}
.start-hero{display:grid;gap:1.25rem;align-items:center}
@media (min-width:860px){.start-hero{grid-template-columns:1fr 1.05fr}}
.start-hero h1{font-size:clamp(2.3rem,6vw,3.6rem);line-height:1.08;color:var(--navy)}
.start-hero .sub{font-size:1.15rem;margin-top:.6rem}
.flow{list-style:none;padding:0;margin:1rem 0 0;display:flex;flex-wrap:wrap;gap:.3rem .2rem;align-items:center;font-size:.95rem;color:var(--ink-2)}
.flow li{display:flex;align-items:center;gap:.2rem}
.flow li+li::before{content:"→";color:var(--teal);font-weight:700;margin-right:.2rem}
.flow b{color:var(--ink)}
.hero-map{border-radius:16px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.hero-map svg{display:block;width:100%;height:auto}
.start-grid{display:grid;gap:1.2rem}
@media (min-width:860px){.start-grid{grid-template-columns:1fr 1fr}}
.start-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.slots{display:grid;gap:.7rem}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:.8rem .9rem;display:grid;gap:.35rem}
.slot.active{border-color:var(--teal)}
.slot-top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.slot-name{font-weight:700}
.slot-meta{font-size:.84rem;color:var(--ink-2)}
.slot-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.2rem}

/* ---------- step 1: map ---------- */
.explore{display:grid;gap:1.2rem}
@media (min-width:1200px){.explore{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.map-scroll{overflow-x:auto;border-radius:16px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.map{position:relative;min-width:620px;aspect-ratio:1000/620}
.map > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;width:15%;height:22%;transform:translate(-50%,-50%);border:2px dashed transparent;border-radius:14px;background:transparent;cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:center}
.spot:hover{background:var(--spot-hover);border-color:var(--m-edge)}
.spot.on{border-color:var(--m-hl);background:var(--spot-hover)}
.spot-pill{display:inline-flex;align-items:center;gap:.3em;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:.2em .65em .2em .45em;font-size:.84rem;font-weight:700;white-space:nowrap;margin-bottom:-.9em;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.spot-pill svg{width:16px;height:16px;flex:none}
.spot.on .spot-pill{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.place-panel{display:grid;gap:1rem}
.place-card .pc-head{display:flex;gap:.7rem;align-items:center;margin-bottom:.6rem}
.pc-icon{width:48px;height:48px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;flex:none}
.pc-icon svg{width:28px;height:28px}
.place-card h2{margin:0}
.place-card dl{margin:.4rem 0 1rem;display:grid;gap:.3rem;font-size:.93rem}
.place-card dt{font-weight:700;display:inline}
.place-card dd{display:inline;margin:0;color:var(--ink-2)}
.place-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.45rem}
.place-list button{width:100%;display:flex;align-items:center;gap:.45rem;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:.35rem .6rem;cursor:pointer;text-align:left;font-weight:500;color:var(--ink)}
.place-list button svg{width:20px;height:20px;flex:none;color:var(--teal)}
.place-list button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);font-weight:700}
.place-list button[aria-pressed="true"]::after{content:"✓ 선택";margin-left:auto;font-size:.78rem;color:var(--navy)}

/* ---------- step 2 ---------- */
.place-tag{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.2rem .4rem .2rem .8rem;font-weight:700}
.place-tag svg{width:20px;height:20px;color:var(--teal)}
.scen-grid{display:grid;gap:.8rem}
@media (min-width:760px){.scen-grid{grid-template-columns:repeat(3,1fr)}}
.scenario{display:flex;flex-direction:column;gap:.5rem;text-align:left;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:1rem;cursor:pointer;min-height:140px;color:var(--ink)}
.scenario:hover{border-color:var(--navy)}
.scenario[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal);background:var(--teal-soft)}
.sc-tag{font-size:.78rem;font-weight:700;letter-spacing:.05em;color:var(--teal)}
.sc-text{font-size:1.02rem;font-weight:500;flex:1}
.sc-state{font-size:.86rem;color:var(--ink-2);font-weight:700}
.scenario[aria-pressed="true"] .sc-state{color:var(--teal)}
.scenario.custom{border-style:dashed}

/* ---------- step 3 ---------- */
.helper{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .6rem}
.helper span{font-size:.88rem;background:var(--amber-soft);border-radius:99px;padding:.15em .75em}
.statement{background:var(--surface-2);border-radius:12px;padding:1rem}
.statement textarea{font-size:1.05rem;font-weight:500;background:var(--surface)}

/* ---------- step 4/5 ---------- */
.problem-box{border-left:4px solid var(--teal);background:var(--surface);border-radius:0 10px 10px 0;padding:.7rem 1rem;font-weight:500}
.problem-box small{display:block;color:var(--ink-2);font-weight:700;font-size:.78rem;letter-spacing:.05em}
.method-grid{display:grid;gap:.9rem}
@media (min-width:760px){.method-grid{grid-template-columns:1fr 1fr}}
.method{display:grid;gap:.55rem;align-content:start}
.method-head{display:flex;gap:.6rem;align-items:center}
.method-sym{font-size:1.4rem;width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.method-head h2{margin:0;font-size:1.3rem}
.method p{font-size:.92rem;color:var(--ink-2)}
.idea-list{display:grid;gap:.8rem}
.idea{display:grid;gap:.55rem}
.idea-top{display:flex;gap:.5rem;align-items:center}
.idea-top select{width:auto;flex:none;min-width:8.5em}
.idea-top input{flex:1;min-width:0;font-weight:700}
.count-pill{display:inline-block;font-size:.85rem;font-weight:700;padding:.1em .7em;border-radius:99px;background:var(--amber-soft);color:var(--amber);margin-left:.4rem;vertical-align:.15em;font-family:var(--f-body)}
.count-pill.ok{background:var(--good-soft);color:var(--good)}

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = (s) => esc(s).replace(/\n/g, '<br>');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const filled = (s) => typeof s === 'string' && s.trim().length > 0;
const pad = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const krDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; };
const krTime = (d) => d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
// 받침 유무에 따라 조사 고르기 (예: 학생이 / 어르신이 / 주민이 / 누구나가)
function josa(word, withB, withoutB) {
  const w = String(word).trim(); const c = w.charCodeAt(w.length - 1);
  if (!w || c < 0xac00 || c > 0xd7a3) return w + withB + '(' + withoutB + ')';
  return w + ((c - 0xac00) % 28 ? withB : withoutB);
}

/* ---------- 프로젝트 데이터 ---------- */
function newProject(teamName = '', nickname = '') {
  const now = new Date().toISOString();
  return {
    version: 1, id: uid(), createdAt: now, updatedAt: now, teamName, nickname, currentStep: 1,
    locationId: null, selectedScenarioId: null, problemDescription: '', situationDescription: '', problemType: '',
    targetUsers: [], whenWhere: '', rootCauses: [], neededFunctions: [], designConstraints: [],
    problemStatement: '', problemStatementEdited: false,
    ideas: [], selectedIdeaId: null, selectionReason: '',
    inventionName: '', oneLiner: '', coreFunctions: ['', '', ''], usageSteps: ['', '', ''], materials: [],
    designSketchDataUrl: null, designText: '', buildNotes: '',
    testStatus: '', testMethod: '',
    testResults: TEST_CRITERIA.map(c => ({ criterion: c, outcome: 'not_tested', note: '' })),
    peerFeedback: '', plannedChanges: '', changesMade: '', afterTestNotes: '', neighborhoodImpact: '',
  };
}

// 저장된 값이나 불러온 파일을 '안전한 프로젝트'로 다시 만듭니다. 알 수 없는 값은 버립니다.
function normalizeProject(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('형식');
  if (raw.version !== 1) throw new Error('버전');
  const p = newProject();
  const str = (v, max = 4000) => (typeof v === 'string' ? v.slice(0, max) : '');
  const arr = (v, n = 30, max = 400) => (Array.isArray(v) ? v.filter(x => typeof x === 'string').slice(0, n).map(x => x.slice(0, max)) : []);
  const oneOf = (v, list, d) => (list.includes(v) ? v : d);
  for (const k of ['teamName', 'nickname']) p[k] = str(raw[k], 40);
  for (const k of ['problemDescription', 'situationDescription', 'whenWhere', 'problemStatement', 'selectionReason', 'inventionName', 'oneLiner',
    'designText', 'buildNotes', 'testMethod', 'peerFeedback', 'plannedChanges', 'changesMade', 'afterTestNotes', 'neighborhoodImpact']) p[k] = str(raw[k]);
  p.problemType = oneOf(raw.problemType, PROBLEM_TYPES, '');
  if (typeof raw.id === 'string' && raw.id.length < 40) p.id = raw.id;
  for (const k of ['createdAt', 'updatedAt']) if (typeof raw[k] === 'string' && !isNaN(new Date(raw[k]))) p[k] = raw[k];
  p.currentStep = Number.isInteger(raw.currentStep) ? Math.min(8, Math.max(1, raw.currentStep)) : 1;
  p.locationId = PLACE[raw.locationId] ? raw.locationId : null;
  p.selectedScenarioId = raw.selectedScenarioId === 'custom' || scenarioText(raw.selectedScenarioId) ? raw.selectedScenarioId : null;
  for (const k of ['targetUsers', 'rootCauses', 'neededFunctions', 'designConstraints', 'materials']) p[k] = arr(raw[k]);
  p.problemStatementEdited = raw.problemStatementEdited === true;
  const cf = arr(raw.coreFunctions, 3); p.coreFunctions = [0, 1, 2].map(i => cf[i] || '');
  const us = arr(raw.usageSteps, 12); p.usageSteps = us.length ? us : ['', '', ''];
  p.ideas = (Array.isArray(raw.ideas) ? raw.ideas : []).slice(0, 40).filter(x => x && typeof x === 'object').map(x => {
    const ev = x.evaluation && typeof x.evaluation === 'object' ? x.evaluation : {};
    const evaluation = {};
    for (const c of EVAL_CRITERIA) if (['good', 'okay', 'retry'].includes(ev[c.k])) evaluation[c.k] = ev[c.k];
    return { id: typeof x.id === 'string' && x.id.length < 40 ? x.id : uid(), method: oneOf(x.method, Object.keys(METHODS), 'free'), title: str(x.title, 200), description: str(x.description, 2000), evaluation };
  });
  p.selectedIdeaId = p.ideas.some(i => i.id === raw.selectedIdeaId) ? raw.selectedIdeaId : null;
  const img = raw.designSketchDataUrl;
  p.designSketchDataUrl = typeof img === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(img) && img.length < 3000000 ? img : null;
  p.testStatus = oneOf(raw.testStatus, ['tested', 'not_tested'], '');
  const tr = Array.isArray(raw.testResults) ? raw.testResults : [];
  p.testResults = TEST_CRITERIA.map((c, i) => {
    const r = tr[i] && typeof tr[i] === 'object' ? tr[i] : {};
    return { criterion: c, outcome: oneOf(r.outcome, ['good', 'improve', 'retry', 'not_tested'], 'not_tested'), note: str(r.note, 500) };
  });
  return p;
}

function emptyStore() { return { version: 1, active: null, slots: Array(SLOT_COUNT).fill(null), settings: { townName: '발명마을' } }; }
function loadStore() {
  const s = emptyStore();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return s;
    const data = JSON.parse(raw);
    if (data && Array.isArray(data.slots)) {
      s.slots = Array.from({ length: SLOT_COUNT }, (_, i) => { try { return data.slots[i] ? normalizeProject(data.slots[i]) : null; } catch (e) { return null; } });
      s.active = Number.isInteger(data.active) && s.slots[data.active] ? data.active : null;
      if (data.settings && typeof data.settings.townName === 'string' && data.settings.townName.trim()) s.settings.townName = data.settings.townName.slice(0, 20);
    }
  } catch (e) { storageOK = false; }
  return s;
}
function writeStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); storageOK = true; saveState = { state: 'saved', at: new Date() }; }
  catch (e) { storageOK = false; saveState = { state: 'error', at: null }; }
  paintSave();
}
function touch() {
  if (P) P.updatedAt = new Date().toISOString();
  saveState.state = 'saving'; paintSave();
  clearTimeout(saveTimer); saveTimer = setTimeout(writeStore, 400);
}
function flushSave() { clearTimeout(saveTimer); writeStore(); }
function saveLabel() {
  if (saveState.state === 'error' || !storageOK) return '이 기기에 저장할 수 없어요 · 활동 파일로 저장하세요';
  if (saveState.state === 'saving') return '저장하는 중…';
  if (saveState.at) return `자동 저장됨 · ${krTime(saveState.at)}`;
  return '자동 저장 켜짐';
}
function paintSave() {
  const el = $('#saveStatus'); if (!el) return;
  el.textContent = saveLabel();
  el.dataset.state = !storageOK ? 'error' : saveState.state;
}
window.addEventListener('beforeunload', () => { if (saveTimer) flushSave(); });
window.addEventListener('pagehide', () => { if (saveTimer) flushSave(); });

/* ---------- 문제 정리 문장 자동 만들기 ---------- */
function buildStatement(p) {
  const place = p.locationId ? PLACE[p.locationId].name : '○○';
  const users = p.targetUsers.length ? p.targetUsers.join(', ') : '○○';
  const cause = p.rootCauses.find(filled) || (filled(p.problemDescription) ? '' : '○○');
  const func = p.neededFunctions.find(filled) || '○○';
  const causePart = cause ? `${cause} 때문에 불편하므로` : `"${p.problemDescription.trim()}" 문제로 불편하므로`;
  return `${place}에서 ${josa(users, '이', '가')} ${causePart}, ${func} 기능이 필요하다.`;
}
const statementOf = (p) => (filled(p.problemStatement) ? p.problemStatement : buildStatement(p));
const selectedIdea = (p) => p.ideas.find(i => i.id === p.selectedIdeaId) || null;

      ${view === 'app' ? `<button class="btn ghost sm" data-act="resetProject">처음부터 다시 하기</button>` : ''}
    </div></div></header>`;
}

function render(opts = {}) {
  // 다시 그린 뒤 포커스와 커서 위치를 되살립니다.
  const a = document.activeElement;
  const key = opts.stepChanged ? null : focusKey(a);
  const caret = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;
  document.body.classList.remove('presenting');
  app.innerHTML = header() + (view === 'start' ? renderStart() : renderApp());
  paintSave();
  if (view === 'app' && P.currentStep === 6) initCanvas();
  if (opts.stepChanged) {
    window.scrollTo(0, 0);
    const h = $('#step-title'); if (h) h.focus({ preventScroll: true });
  } else if (key) {
    const el = document.querySelector(key);
    if (el) { el.focus({ preventScroll: true }); if (caret != null) { try { el.setSelectionRange(caret, caret); } catch (e) { /* 무시 */ } } }
  }
}
function focusKey(el) {
  if (!el || el === document.body || !app.contains(el)) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  const ds = el.dataset; const parts = Object.keys(ds).map(k => `[data-${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}="${CSS.escape(ds[k])}"]`);
  return parts.length ? el.tagName.toLowerCase() + parts.join('') : null;
}

/* ---------- 시작 화면 ---------- */

function latestSlot() {
  let best = -1, t = -Infinity;
  store.slots.forEach((p, i) => { if (p) { const v = new Date(p.updatedAt).getTime() || 0; if (v > t) { t = v; best = i; } } });
  return best;
}

/* ---------- 활동 화면 (공통 틀) ---------- */
function renderSide() {
  const item = (n) => `<li><button data-act="goto" data-n="${n}" ${P.currentStep === n ? 'aria-current="step"' : ''}>

function renderApp() {
  const n = P.currentStep; const S = STEPS[n];

  const body = [null, step1, step2, step3, step4, step5, step6, step7, step8][n]();

function initCanvas() {
  const c = $('#sketch'); if (!c || !c.getContext) return;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  if (SK.pid !== P.id) { SK.pid = P.id; SK.undo = []; SK.img = null; }
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
  if (SK.img) ctx.putImageData(SK.img, 0, 0);
  else if (P.designSketchDataUrl) {
    const im = new Image();
    im.onload = () => { ctx.drawImage(im, 0, 0, c.width, c.height); SK.img = ctx.getImageData(0, 0, c.width, c.height); };
    im.src = P.designSketchDataUrl;
  }
  paintUndo();
  let drawing = false, last = null, pointer = null;
  const pos = (e) => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; };
  const style = () => {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = ctx.fillStyle = SK.tool === 'eraser' ? '#ffffff' : SK.color;
    ctx.lineWidth = SIZES[SK.size].w * (SK.tool === 'eraser' ? 3 : 1);
  };
  c.addEventListener('pointerdown', (e) => {
    if (e.button > 0 || drawing) return;
    e.preventDefault(); drawing = true; pointer = e.pointerId;
    try { c.setPointerCapture(pointer); } catch (err) { /* 무시 */ }
    SK.undo.push(ctx.getImageData(0, 0, c.width, c.height)); if (SK.undo.length > 25) SK.undo.shift();
    last = pos(e); style(); ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
  });
  c.addEventListener('pointermove', (e) => {
    if (!drawing || e.pointerId !== pointer) return;
    e.preventDefault(); style();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) { const p = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; }
  });
  const end = (e) => { if (!drawing || e.pointerId !== pointer) return; drawing = false; commitCanvas(); };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
function isBlank(img) { const d = img.data; for (let i = 0; i < d.length; i += 16) if (d[i] < 250 || d[i + 1] < 250 || d[i + 2] < 250) return false; return true; }
function commitCanvas() {
  const c = $('#sketch'); if (!c) return; const ctx = c.getContext('2d');
  SK.img = ctx.getImageData(0, 0, c.width, c.height);
  P.designSketchDataUrl = isBlank(SK.img) ? null : c.toDataURL('image/png');
  touch(); paintUndo(); refreshSide();
  const st = $('#canvas-state'); if (st) st.textContent = P.designSketchDataUrl ? '그림이 저장되었어요.' : '아직 그린 그림이 없어요.';
}
function paintUndo() { const b = $('#btn-undo'); if (b) b.disabled = !SK.undo.length; }

      ${filled(p.oneLiner) ? `<p class="r-one">${esc(p.oneLiner)}</p>` : ''}${meta}</header>

    : `<p><span class="r-flag">시험 미실시</span> 아직 모형을 시험하지 않았어요. 시험 결과는 적지 않았어요.</p>`;
  const page2 = `<div class="sheet">
    <section class="r-sec"><h3><span>6.</span>최종 발명품의 핵심 기능과 사용 방법</h3>
      <dl class="r-grid"><dt>핵심 기능</dt><dd>${lst(p.coreFunctions, true)}</dd><dt>사용 방법</dt><dd>${lst(p.usageSteps, true)}</dd></dl></section>
    <section class="r-sec"><h3><span>7.</span>설계도</h3>
      ${p.designSketchDataUrl ? `<img class="r-sketch" src="${p.designSketchDataUrl}" alt="${esc(p.inventionName || '발명품')} 설계도 그림">` : ''}
      ${filled(p.designText) ? `<p class="r-box"><b>글 설명:</b> ${nl(p.designText)}</p>` : p.designSketchDataUrl ? '' : '<span class="empty">설계도 그림과 글 설명을 작성하지 않음</span>'}</section>
    <section class="r-sec"><h3><span>8.</span>사용 재료 및 제작 과정</h3>
      <dl class="r-grid"><dt>재료</dt><dd>${p.materials.length ? esc(p.materials.join(', ')) : '<span class="empty">작성하지 않음</span>'}</dd><dt>제작 기록</dt><dd>${v(p.buildNotes)}</dd></dl></section>
    <section class="r-sec long"><h3><span>9.</span>시험 결과, 친구 의견, 개선한 점</h3>${testBlock}
      <dl class="r-grid"><dt>친구 의견</dt><dd>${v(p.peerFeedback)}</dd><dt>수정할 부분</dt><dd>${v(p.plannedChanges)}</dd><dt>바꾼 점</dt><dd>${v(p.changesMade)}</dd><dt>수정 후 결과</dt><dd>${v(p.afterTestNotes)}</dd></dl></section>
    <section class="r-sec"><h3><span>10.</span>이 발명으로 우리 동네가 어떻게 달라질까요?</h3><p>${v(p.neighborhoodImpact)}</p></section>
    <p class="r-foot">이 제안서는 수업을 위해 만든 가상의 ${esc(town())}을 바탕으로 작성했어요. · 우리 동네 발명 지도</p>
  </div>`;
  return `<article class="paper">${page1}${page2}</article>`;
}

const dlg = $('#dlg');
function ask({ title, body = '', buttons = [{ label: '확인', value: 'ok', kind: 'primary' }], wide = false }) {
  return new Promise(resolve => {
    if (dlg.open) dlg.close('cancel');
    dlg.className = 'dlg' + (wide ? ' wide' : '');
    dlg.innerHTML = `<form method="dialog" class="dlg-in"><h2 class="dlg-title" id="dlg-title">${esc(title)}</h2><div class="dlg-body">${body}</div>
      <div class="dlg-actions">${buttons.map(b => `<button class="btn ${b.kind || ''}" value="${esc(b.value)}" ${b.auto ? 'autofocus' : ''}>${esc(b.label)}</button>`).join('')}</div></form>`;
    dlg.setAttribute('aria-labelledby', 'dlg-title');
    dlg.returnValue = '';
    const onClose = () => { dlg.removeEventListener('close', onClose); resolve(dlg.returnValue || 'cancel'); };
    dlg.addEventListener('close', onClose);
    dlg.showModal();
  });
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* =====================================================================

function go(n) {
  if (!P) return;
  P.currentStep = Math.min(8, Math.max(1, n)); touch();
  render({ stepChanged: true });
}
function openProject(i) {
  store.active = i; P = store.slots[i]; view = 'app'; SK.pid = null;
  flushSave(); render({ stepChanged: true });
}
async function confirmOverwrite(i) {
  const old = store.slots[i]; if (!old) return true;
  const r = await ask({ title: `저장 칸 ${i + 1}의 기록을 지울까요?`, body: `<p>이 칸에는 <b>${esc([old.teamName, old.nickname].filter(filled).join(' · ') || '이름 없는 모둠')}</b>의 기록(${old.currentStep}/8 단계)이 있어요. 계속하면 그 기록이 사라지고 되돌릴 수 없어요.</p>`,
    buttons: [{ label: '취소', value: 'cancel', auto: true }, { label: '지우고 새로 시작', value: 'ok', kind: 'danger' }] });
  return r === 'ok';
}
function startIn(i) {
  const team = ($('#s-team') || {}).value || ''; const nick = ($('#s-nick') || {}).value || '';
  store.slots[i] = newProject(team.trim().slice(0, 30), nick.trim().slice(0, 30));
  for (const k in drafts) delete drafts[k];
  openProject(i);
}
function hasProblemData(p) { return !!(p.selectedScenarioId || filled(p.problemDescription) || p.targetUsers.length || p.rootCauses.length || p.neededFunctions.length); }
function clearProblem(p, alsoProblem) {
  if (alsoProblem) { p.selectedScenarioId = null; p.problemDescription = ''; p.situationDescription = ''; p.problemType = ''; }
  p.targetUsers = []; p.whenWhere = ''; p.rootCauses = []; p.neededFunctions = []; p.designConstraints = []; p.problemStatement = ''; p.problemStatementEdited = false;
}
const LIST_KEYS = ['targetUsers', 'rootCauses', 'neededFunctions', 'designConstraints', 'materials', 'usageSteps'];

    const v = ($('#t-town').value || '').trim().slice(0, 20);
    store.settings.townName = v || '발명마을'; flushSave(); toast(`마을 이름을 '${town()}'(으)로 바꿨어요.`);
    if (view === 'app') render();

/* ---------- 활동 파일 내보내기 / 불러오기 ---------- */
function exportFlow() {
  flushSave();
  const text = JSON.stringify({ app: APP_ID, version: 1, exportedAt: new Date().toISOString(), project: P }, null, 1);
  const fname = `우리동네발명지도_발명제안서_${today()}.json`;
  if (EMBEDDED) {
    ask({ title: '활동 기록 복사하기', wide: true, body: `<p>미리 보기 창에서는 파일을 내려받을 수 없어요. 아래 글을 복사해 메모장에 붙여 넣고 <b>${esc(fname)}</b> 이름으로 저장하면 활동 파일이 돼요.</p>
      <textarea id="export-text" rows="8" readonly aria-label="활동 기록">${esc(text)}</textarea><p><button type="button" class="btn primary" data-act="copyExport">복사하기</button></p>`,
      buttons: [{ label: '닫기', value: 'ok' }] });
    return;
  }
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(`'${fname}' 파일을 저장했어요. 다운로드 폴더를 확인하세요.`);
  } catch (e) { toast('파일을 저장하지 못했어요. 다른 브라우저에서 다시 해 보세요.'); }
}
async function importFlow() {
  const firstEmpty = store.slots.findIndex(s => !s);
  const def = firstEmpty >= 0 ? firstEmpty : 0;
  const r = await ask({ title: '활동 파일 불러오기', wide: true, body: `<p>전에 저장한 활동 파일(.json)을 고르세요. 파일 대신 복사해 둔 기록을 붙여 넣어도 돼요.</p>
    <div class="field"><label for="imp-file">활동 파일</label><input type="file" id="imp-file" accept=".json,application/json"></div>
    <div class="field"><label for="imp-text">또는 기록 붙여 넣기</label><textarea id="imp-text" rows="4"></textarea></div>
    <fieldset style="border:0;padding:0;margin:0"><legend class="label">불러올 저장 칸</legend><div class="chips">${store.slots.map((s, i) => `<label class="chip" style="margin:0"><input type="radio" name="imp-slot" value="${i}" ${i === def ? 'checked' : ''}> ${i + 1}번 칸 ${s ? '(기록 있음)' : '(비어 있음)'}</label>`).join('')}</div></fieldset>`,
    buttons: [{ label: '취소', value: 'cancel' }, { label: '불러오기', value: 'import', kind: 'primary' }] });
  if (r !== 'import') return;
  const file = $('#imp-file').files[0]; const pasted = $('#imp-text').value.trim();
  const slot = +((document.querySelector('input[name="imp-slot"]:checked') || {}).value || def);
  let text = pasted;
  if (file) {
    if (file.size > 6 * 1024 * 1024) return badFile('파일이 너무 커요.');
    try { text = await file.text(); } catch (e) { return badFile('파일을 읽지 못했어요.'); }
  }
  if (!text) return badFile('파일을 고르거나 기록을 붙여 넣어 주세요.');
  let proj;
  try {
    const data = JSON.parse(text);
    const raw = data && data.app === APP_ID ? data.project : data;
    if (data && data.app && data.app !== APP_ID) throw new Error('다른 앱');
    proj = normalizeProject(raw);
  } catch (e) { return badFile('이 파일은 우리 동네 발명 지도의 활동 파일이 아니거나 내용이 망가졌어요.'); }
  if (!(await confirmOverwrite(slot))) return;
  store.slots[slot] = proj; openProject(slot);
  toast(`활동을 불러왔어요. 저장 칸 ${slot + 1}에서 이어서 해요.`);
}
function badFile(msg) { ask({ title: '불러오지 못했어요', body: `<p>${esc(msg)}</p><p class="fine">'활동 파일 저장하기'로 만든 .json 파일을 골라 주세요. 지금 저장된 기록은 그대로예요.</p>` }); }

function refreshSide() { const s = $('#side'); if (s) s.innerHTML = renderSide(); }
let reportTimer = null;
function afterEdit(t) {
  const n = P.currentStep;
  if (n === 3 && t.dataset.f !== 'problemStatement' && !P.problemStatementEdited) {
    P.problemStatement = buildStatement(P); const st = $('#f-statement'); if (st) st.value = P.problemStatement;
  }
  if (n === 7) { const c = $('#compare'); if (c) c.innerHTML = compareHTML(); }
  if (n === 8) {
    const h = $('#hero-name'); if (h) h.textContent = filled(P.inventionName) ? P.inventionName : '발명품 이름을 정해 주세요';
    clearTimeout(reportTimer); reportTimer = setTimeout(() => { const r = $('#report'); if (r) r.innerHTML = reportHTML(P, 'all'); }, 200);
  }
  refreshSide();
}
function setFromInput(t) {
  const f = t.dataset.f; const v = t.value;
  if (t.dataset.idea) { const it = P.ideas.find(x => x.id === t.dataset.idea); if (it && ['title', 'description', 'method'].includes(f)) it[f] = f === 'method' && !METHODS[v] ? 'free' : v; }
  else if (t.dataset.tr != null) { const r = P.testResults[+t.dataset.tr]; if (r && f === 'note') r.note = v; }
  else if (t.dataset.i != null) { if (Array.isArray(P[f])) P[f][+t.dataset.i] = v; }
  else if (typeof P[f] === 'string') { P[f] = v; if (f === 'problemStatement') { P.problemStatementEdited = true; const b = $('[data-act="rebuildStatement"]'); if (b) b.textContent = '위 내용으로 문장 다시 만들기'; } }
  touch();
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.draft != null) { drafts[t.dataset.draft] = t.value; return; }
  if (!P || view !== 'app' || !t.dataset || !t.dataset.f) return;
  setFromInput(t); afterEdit(t);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.f && P) { setFromInput(t); afterEdit(t); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Enter' && !e.isComposing && t.dataset && t.dataset.enter && ACT[t.dataset.enter]) { e.preventDefault(); ACT[t.dataset.enter](t); }
  if (e.key === 'Escape' && document.body.classList.contains('presenting')) ACT.exitPresent();
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});

/* ---------- 시작 ---------- */
if (!storageOK) saveState.state = 'error';
render();
if (!storageOK) toast('이 브라우저에서는 자동 저장을 쓸 수 없어요. 8단계에서 활동 파일로 저장하세요.');
})();
